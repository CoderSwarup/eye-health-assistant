name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13', '3.14']

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📋 Display Python version
        run: python --version

      - name: 💾 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/desktop/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install dependencies
        run: |
          echo "🔧 Installing desktop dependencies..."
          pip install -e ".[dev]"
          echo "✅ Dependencies installed successfully"
        working-directory: apps/desktop

      - name: 🔍 Lint with Ruff
        run: |
          echo "🔍 Running Ruff linter..."
          ruff check .
          echo "✅ Ruff passed"
        working-directory: apps/desktop

      - name: 🏷️ Type check with mypy
        run: |
          echo "🏷️ Running mypy type checker..."
          mypy src/
          echo "✅ mypy passed"
        working-directory: apps/desktop

      - name: 🧪 Run tests with coverage
        run: |
          echo "🧪 Running pytest with coverage..."
          pytest --cov=eye_health_assistant --cov-report=xml --cov-report=term-missing -v
          echo "✅ Tests completed"
          echo "📊 Coverage report generated"
        working-directory: apps/desktop

      - name: ☁️ Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v4
        with:
          files: apps/desktop/coverage.xml
          flags: desktop
          fail_ci_if_error: false
          verbose: true
